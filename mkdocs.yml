site_name: Streamdaq Docs
repo_url: https://github.com/bilpapster/stream-DaQ
repo_name: datalab/streamdaq
theme:
  logo: images/logo.png
  favicon: images/logo.png
  name: material
  features:
    - navigation.footer
    - content.code.select
    - content.code.annotate
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
    annotation: material/arrow-right-circle

  font:
    text: Nunito
    code: JetBrains Mono
extra_css:
  - stylesheets/extra.css
extra:
  homepage: https://datalab.csd.auth.gr/
plugins:
  - search
  - gen-files:
      scripts:
      - scripts/generate_api_reference_docs.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - git-committers:
      repository: Datalab-Csd-Auth/streamdaq
      branch: main
      enabled: true
  - glightbox
  - mkdocs-jupyter:
      execute: true
      allow_errors: false
      kernel_name: python3
      include_source: True
  - git-revision-date-localized:
      enable_creation_date: false
  - mkdocstrings:  # https://mkdocstrings.github.io/python/reference/api/
      handlers:
        python:
          options:
            docstring_style: google
            modernize_annotations: true
            show_root_heading: true
            show_source: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_if_no_docstring: true
            members_order: alphabetical
            filters:
              - "!^_"
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.details
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tilde
nav:
  - Home: index.md
  - Concepts:
    - Overview: concepts/index.md
    - Stream-first Data Quality: concepts/data-quality.md
    - Real-time Monitoring: concepts/real-time-monitoring.md
    - Compact vs Native Data Formats: concepts/compact-vs-native-data.md
  - Examples:
    - notebooks/starting_example.ipynb
  - API Reference: reference/
